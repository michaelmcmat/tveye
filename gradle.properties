org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true

# The Firefox engine version. CI bumps this to the newest release on maven.mozilla.org.
geckoviewVersion=160.0.20261104181552

# Overridden on the command line by CI (-PtveyeVersionCode=N); local builds use this.
tveyeVersionCode=1

# GitHub repository ("owner/name") whose releases the app checks for updates. Empty = no update check.
tveyeUpdateRepo=
